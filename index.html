<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="/typing/">
  <title>ETEA — Typing Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a237e;
      --primary-light: #283593;
      --accent: #00b0ff;
      --accent2: #00e5ff;
      --danger: #ef5350;
      --success: #00c853;
      --warn: #ff9100;
      --bg: #f0f2f8;
      --card: #ffffff;
      --text: #1c1c2e;
      --muted: #6b7280;
      --border: #e2e6ea;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); }

    /* ── NAV ── */
    .app-nav {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 12px rgba(26,35,126,.35);
      position: relative;
      z-index: 10;
    }
    .app-nav .logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
    }
    .app-nav .logo-badge {
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 1.5px;
    }
    .app-nav .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      padding: 0;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* ── LOADER OVERLAY ── */
    .overlay-dark {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 2000;
      display: flex; align-items: center; justify-content: center;
    }
    .spinner-ring {
      width: 60px; height: 60px;
      border: 4px solid rgba(255,255,255,.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── LOGIN PAGE ── */
    .login-page {
      min-height: calc(100vh - 56px);
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 12% 20%, rgba(0,176,255,.14), transparent 32%),
        radial-gradient(circle at 88% 80%, rgba(26,35,126,.12), transparent 34%),
        linear-gradient(145deg, #e8edf8 0%, #edf5ff 46%, #e5f2ff 100%);
      padding: 24px;
    }
    .login-layout {
      width: 100%;
      max-width: 1160px;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, .85fr);
      gap: 22px;
      align-items: stretch;
    }
    .keyboard-panel,
    .login-card {
      background: var(--card);
      border: 1px solid rgba(26,35,126,.08);
      border-radius: 18px;
      box-shadow: 0 12px 44px rgba(17,24,39,.10);
    }
    .keyboard-panel {
      padding: 28px;
      position: relative;
      overflow: hidden;
    }
    .keyboard-panel::before {
      content: "";
      position: absolute;
      top: -70px;
      right: -70px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,176,255,.22) 0%, rgba(0,176,255,0) 72%);
      pointer-events: none;
    }
    .kb-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }
    .kb-header i {
      font-size: 26px;
      color: var(--primary);
    }
    .kb-header h3 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 28px;
      line-height: 1;
      letter-spacing: .4px;
      color: var(--primary);
      margin: 0;
    }
    .kb-subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .exam-instructions {
      list-style: none;
      margin: 0 0 16px;
      padding: 0;
      display: grid;
      gap: 8px;
      position: relative;
      z-index: 1;
    }
    .exam-instructions li {
      background: #f6f8fe;
      border: 1px solid #e5e9f8;
      border-radius: 10px;
      color: #334155;
      font-size: 13px;
      line-height: 1.45;
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .exam-instructions li i {
      font-size: 18px;
      color: var(--accent);
      margin-top: 1px;
      flex: 0 0 auto;
    }
    .kb-input-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
      display: block;
      position: relative;
      z-index: 1;
    }
    .keyboard-practice {
      width: 100%;
      min-height: 188px;
      resize: vertical;
      border: 2px solid #d7deef;
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: #0f172a;
      background: #fbfdff;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      position: relative;
      z-index: 1;
    }
    .keyboard-practice:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0,176,255,.14);
      background: #fff;
    }
    .kb-footer {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }
    .login-card {
      padding: 28px 30px 30px;
      width: 100%;
      max-width: 100%;
      align-self: center;
    }
    .login-emblem {
      text-align: center;
      margin-bottom: 18px;
    }
    .login-emblem .seal {
      width: 72px;
      height: 72px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      box-shadow: 0 2px 8px rgba(26,35,126,.15);
    }
    .login-emblem .seal i { color: #fff; font-size: 34px; }
    .login-emblem .seal img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 8px;
    }
    .login-emblem h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
      margin: 0;
    }
    .login-emblem p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      display: block;
    }
    .field-group { margin-bottom: 14px; }
    .field-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
      display: block;
    }
    .field-wrap {
      position: relative;
    }
    .field-wrap i {
      display: none;
    }
    .field-input {
      width: 100%;
      height: 46px;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: #f8f9fc;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    .field-input:focus {
      border-color: var(--accent);
      background: #fff;
    }
    .field-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .otp-field .field-input {
      letter-spacing: 6px;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      padding-left: 14px;
      color: var(--primary);
      border-color: #c5cae9;
      background: #e8eaf6;
    }
    .otp-field .field-input:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .login-btn {
      width: 100%;
      height: 50px;
      display: block;
      appearance: none;
      -webkit-appearance: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      letter-spacing: .5px;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 14px rgba(26,35,126,.35);
      margin-top: 8px;
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,35,126,.4); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }

    .alert-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .alert-error { background: #fdecea; color: var(--danger); border: 1px solid #f5c6cb; }
    .alert-warn  { background: #fff3e0; color: var(--warn);   border: 1px solid #ffe0b2; }

    @media (max-width: 1024px) {
      .login-layout {
        grid-template-columns: 1fr;
        max-width: 760px;
      }
      .keyboard-panel,
      .login-card {
        padding: 22px;
      }
      .keyboard-practice {
        min-height: 165px;
      }
    }
    @media (max-width: 600px) {
      .login-page {
        padding: 12px;
      }
      .kb-header h3 {
        font-size: 24px;
      }
      .keyboard-practice {
        min-height: 150px;
      }
    }

    /* ── TYPING TEST PAGE ── */
    .test-page {
      height: calc(100vh - 56px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      gap: 10px;
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .stat-card {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      display: flex; align-items: center; gap: 10px;
    }
    .stat-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .stat-icon i { font-size: 20px; }
    .stat-icon.blue { background: #e3f2fd; }
    .stat-icon.blue i { color: #1565c0; }
    .stat-icon.green { background: #e8f5e9; }
    .stat-icon.green i { color: #2e7d32; }
    .stat-icon.red { background: #fce4ec; }
    .stat-icon.red i { color: #c62828; }
    .stat-icon.orange { background: #fff3e0; }
    .stat-icon.orange i { color: #e65100; }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
    .stat-value { font-size: 20px; font-weight: 700; line-height: 1; }
    .stat-value.green-text { color: var(--success); }
    .stat-value.red-text { color: var(--danger); }
    .stat-value.orange-text { color: var(--warn); }

    /* Timer card */
    .timer-card {
      background: linear-gradient(135deg, var(--primary) 0%, #283593 100%);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(26,35,126,.25);
    }
    .timer-label { color: rgba(255,255,255,.7); font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .timer-display {
      font-family: 'Rajdhani', sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
      line-height: 1;
    }
    .timer-display.danger { color: #ff6b6b; animation: blink-timer 1s ease-in-out infinite; }
    @keyframes blink-timer { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    .timer-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .wpm-badge {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .accuracy-badge {
      font-size: 12px;
      color: rgba(255,255,255,.75);
    }

    /* Paragraph area */
    .paragraph-wrap {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      overflow: hidden;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .paragraph-header {
      padding: 8px 16px;
      background: #f8f9fc;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .typing-paragraph {
      flex: 1;
      overflow-y: auto;
      overflow-anchor: none;
      scroll-behavior: auto;
      padding: 16px;
      font-size: 26px;
      line-height: 1.7;
      color: #37474f;
      word-spacing: 4px;
    }
    .typing-paragraph span { border-radius: 4px; }

    /* Input */
    .type-input-wrap {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .type-input-wrap i { color: var(--muted); }
    .typed-words {
      flex: 1;
      border: none !important;
      outline: none !important;
      background: transparent !important;
      font-size: 20px !important;
      font-family: 'Inter', sans-serif !important;
      font-weight: 600 !important;
      color: var(--text) !important;
      text-align: center;
      box-shadow: none !important;
      border-bottom: none !important;
    }
    .typed-words::placeholder { color: #b0bec5; font-weight: 400; font-size: 16px; }

    /* Result page */
    .result-page {
      height: calc(100vh - 56px);
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .result-hero {
      text-align: center;
    }
    .wpm-circle {
      width: 140px; height: 140px;
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }
    .wpm-circle.pass { background: linear-gradient(135deg, #00b09b, #96c93d); }
    .wpm-circle.avg  { background: linear-gradient(135deg, #f7971e, #ffd200); }
    .wpm-circle.fail { background: linear-gradient(135deg, #f953c6, #b91d73); }
    .wpm-circle .wpm-num { font-family: 'Rajdhani', sans-serif; font-size: 52px; font-weight: 700; color: #fff; line-height: 1; }
    .wpm-circle .wpm-lbl { font-size: 12px; color: rgba(255,255,255,.85); font-weight: 600; letter-spacing: 1px; }
    .result-title { font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 700; color: var(--primary); }
    .result-sub {
      font-size: 16px;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 500;
    }
    .result-sub.saved {
      font-size: 20px;
      font-weight: 700;
      color: var(--success);
      margin-top: 12px;
      padding: 12px 16px;
      background: rgba(0, 200, 83, .1);
      border-radius: 10px;
      border: 2px solid var(--success);
    }
    .result-sub.saved::before {
      content: "✓ ";
      font-weight: 700;
    }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 640px;
    }
    .result-stat {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .result-stat .rs-val { font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 700; color: var(--primary); }
    .result-stat .rs-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; margin-top: 4px; }
    .result-note {
      background: #e8eaf6;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 13px;
      color: var(--primary);
      font-weight: 500;
      max-width: 520px;
      text-align: center;
    }
    .result-note.pending {
      background: #fee2e2;
      border: 2px solid var(--danger);
      color: var(--danger);
      font-size: 18px;
      font-weight: 700;
      padding: 16px 20px;
      max-width: 560px;
      margin-top: 12px;
    }
    .result-note.pending::before {
      content: "⚠ ";
      font-weight: 700;
    }
    .retry-btn {
      display: inline-block;
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 14px;
      transition: all .2s ease;
      box-shadow: 0 4px 12px rgba(239, 83, 80, .35);
    }
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(239, 83, 80, .45);
    }
    .retry-btn:active {
      transform: translateY(0);
    }
    .retry-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .result-status-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 1500; display: flex; align-items: center; justify-content: center;
    }
    .modal-box {
      background: #fff; border-radius: 14px; padding: 28px 24px;
      max-width: 360px; width: 90%; box-shadow: 0 16px 48px rgba(0,0,0,.2);
      text-align: center;
    }
    .modal-box .modal-icon { font-size: 42px; margin-bottom: 10px; }
    .modal-box h3 { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .modal-box p  { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .modal-close-btn {
      background: var(--primary); color: #fff; border: none; border-radius: 8px;
      padding: 10px 28px; font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    /* Vue transitions */
    .fade-enter-active, .fade-leave-active { transition: opacity .35s ease; }
    .fade-enter, .fade-leave-to { opacity: 0; }
    .slide-enter-active, .slide-leave-active { transition: all .35s ease; }
    .slide-enter { transform: translateY(20px); opacity: 0; }
    .slide-leave-to { transform: translateY(-20px); opacity: 0; }

    /* Layout overrides for candidate photo and timer/result blocks */
    .timer-card { gap: 16px; }
    .timer-avatar {
      width: 88px;
      height: 88px;
      border-radius: 18px;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,.35);
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
      background: rgba(255,255,255,.12);
    }
    .timer-main {
      flex: 1;
      text-align: center;
      min-width: 0;
    }
    .timer-meta .wpm-badge,
    .timer-meta .accuracy-badge { white-space: nowrap; }
    .result-top-strip {
      width: min(980px, 100%);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,.96), rgba(242,247,255,.92));
      border: 1px solid rgba(45,72,177,.14);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 10px 30px rgba(20,35,60,.08);
    }
    .result-top-photo {
      width: 124px;
      height: 124px;
      border-radius: 18px;
      object-fit: cover;
      flex-shrink: 0;
      border: 3px solid #fff;
      box-shadow: 0 12px 28px rgba(20,35,60,.16);
      background: #eef4ff;
    }
    .result-top-copy {
      flex: 1;
      min-width: 0;
      text-align: left;
    }
    .result-top-copy .candidate-line {
      margin-top: 6px;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
    }
    @media (max-width: 600px) {
      .timer-card { padding: 12px 14px; gap: 10px; }
      .timer-avatar { width: 68px; height: 68px; border-radius: 14px; }
      .timer-display { font-size: 36px; }
      .result-top-strip { padding: 14px; gap: 12px; }
      .result-top-photo { width: 88px; height: 88px; }
      .result-top-copy .candidate-line { font-size: 14px; }

<script src="./js/jquery.js"></script>
<script src="./js/vue.js"></script>
<script src="./js/vue-router.js"></script>
<script src="./js/vue-http.js"></script>
<script>
  const APP_BASE = (document.querySelector('base')?.getAttribute('href') || '/').replace(/\/+$/, '/') || '/';
  const normalizePath = p => (p || '').replace(/\/+$/, '') || '/';
  const apiUrl = path => APP_BASE + 'api_backend/' + String(path || '').replace(/^\/+/, '');

  // ── Security: block devtools shortcuts ──
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    const key = (e.key || '').toLowerCase();
    const isDevShortcut =
      (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(key)) ||
      (e.ctrlKey && key === 'u') ||
      (e.ctrlKey && key === 'r') ||
      (e.metaKey && key === 'r') ||
      key === 'f5' ||
      key === 'f12';
    if (isDevShortcut) {
      e.preventDefault(); return false;
    }
  }, true);

  // ════════════════════════════════════════
  // LOGIN COMPONENT
  // ════════════════════════════════════════
  const LoginComponent = Vue.component('login-template', {
    template: '#login-template',
    props: ['showModal'],
    data() {
      return { cnic: '', rollno: '', otp: '', loading: false, errorMsg: '' };
    },
    methods: {
      getLogin() { return localStorage.getItem('_td') ? JSON.parse(localStorage.getItem('_td')) : null; },
      login() {
        this.errorMsg = '';
        if (!this.cnic || !this.rollno || !this.otp) { this.errorMsg = 'Please fill in all fields.'; return; }
        if (isNaN(this.cnic) || this.cnic.length !== 13) { this.errorMsg = 'CNIC must be exactly 13 digits.'; return; }
        if (isNaN(this.rollno)) { this.errorMsg = 'Roll number must be numeric.'; return; }
        if (this.otp.trim().length < 4) { this.errorMsg = 'Enter the lab session password provided by the invigilator.'; return; }
        this.loading = true;
        this.$http.post(apiUrl('login.php'), JSON.stringify({ cnic: this.cnic, rollno: this.rollno, otp: this.otp }))
          .then(r => {
            this.loading = false;
            const res = r.body;
            if (res.status === 'invalid_password') { this.errorMsg = 'Invalid lab session password. Contact your invigilator.'; }
            else if (res.status === 'notfound')     { this.errorMsg = 'CNIC or Roll Number not found in this exam center.'; }
            else if (res.status === 'already_tested')  { this.errorMsg = 'You have already completed this test.'; }
            else if (res.status === 'already_logged')  { this.errorMsg = 'You are already logged in on another device.'; }
            else if (res.status === 'portal_disabled') { this.errorMsg = res.message || 'Candidate portal is currently disabled by admin.'; }
            else if (res.status === 'ok') {
              localStorage.setItem('_td', JSON.stringify(res.user));
              localStorage.setItem('_test_active', '1');
              this.$router.push('/typing-test');
            }
          }).catch(() => { this.loading = false; this.errorMsg = 'Server error. Please try again.'; });
      }
    },
    mounted() {
      // Always land on login page when it is refreshed directly.
      const currentPath = normalizePath(window.location.pathname);
      if (currentPath === normalizePath(APP_BASE) || currentPath === normalizePath(APP_BASE + 'login')) {
        localStorage.removeItem('_td');
        localStorage.removeItem('_test_active');
      }
      $(window).unbind('beforeunload');
    }
  });

  // ════════════════════════════════════════
  // TYPING TEST COMPONENT
  // ════════════════════════════════════════
  const TypingTestComponent = Vue.component('typing-test-template', {
    template: '#typing-test-template',
    props: ['showModal'],
    data() {
      return {
        loading: false,
        userLogin: null,
        typedWord: '',
        typedWords: [],
        paragraphHTML: '',
        processed_words: [],
        unprocessed_words: [],
        paragraph: '',
        correct: 0,
        incorrect: 0,
        character_pressed: 0,
        first: true,
        time: 1, // default minutes (admin can update)
        remaining_time: 0,
        passed_time: 0,
        wpm: 0,
        grossWpm: 0,
        timerHandle: null,
        testFinished: false,
        unloadHandler: null,
        pageHideHandler: null,
        refreshKeyHandler: null,
        visibilityHandler: null,
        activityHandler: null,
        stateKey: null,
        lastActivityTs: 0,
        focusWarningShown: false,
        inactivityLimitSec: 60,
        resultSubmitState: 'idle',
        resultSubmitMessage: '',
        resultRetryTimer: null,
        result: {
          announced: false,
          correct_words: [],
          incorrect_words: [],
          total_characters: 0,
          correct_characters: 0,
          incorrect_characters: 0,
          accuracy: 0,
          wpm: 0,
          gross_wpm: 0
        }
      };
    },
    watch: {
      typedWord(val) {
        if (val[val.length - 1] === ' ') {
          this.typedWords.push(val.trim());
          this.typedWord = '';
          const arr = this.typedWords;
          if (arr.length <= this.unprocessed_words.length) {
            const tw = arr[arr.length - 1];
            this.character_pressed += tw.length + 1;
            const ow = this.unprocessed_words[arr.length - 1];
            const correct = tw === ow;
            if (correct) this.correct++, this.result.correct_words.push(tw);
            else         this.incorrect++, this.result.incorrect_words.push(tw);
            this.processed_words[arr.length - 1] = correct
              ? `<span style="color:#2e7d32;background:#e8f5e9">${ow}</span>`
              : `<span style="color:#c62828;background:#fce4ec;text-decoration:line-through">${ow}</span>`;
            if (arr.length < this.unprocessed_words.length) {
              this.processed_words[arr.length] = `<span id="currentWord" style="background:#fff9c4;border-bottom:2px solid #f9a825">${this.unprocessed_words[arr.length]}</span>`;
            }
            if (arr.length >= this.unprocessed_words.length) {
              this.finalizeTest('completed');
            }
            this.paragraphHTML = this.processed_words.join(' ');
            // Double nextTick ensures all DOM updates are complete before scroll calculation
            this.$nextTick(() => {
              this.$nextTick(() => {
                this.ensureCurrentWordVisible();
              });
            });
          }
        }
      }
    },
    methods: {
      getLogin() { return localStorage.getItem('_td') ? JSON.parse(localStorage.getItem('_td')) : null; },
      candidateImageUrl() {
        const raw = String((this.userLogin && this.userLogin.image_url) || '').trim();
        if (!raw) return '';
        if (/^javascript:/i.test(raw)) return '';
        if (/^(https?:\/\/|data:image\/|\.\.\/|\.\/|\/|[A-Za-z0-9_\-./]+$)/i.test(raw)) return raw;
        return '';
      },
      clearBrokenImage(event) {
        if (event && event.target) {
          event.target.style.display = 'none';
        }
      },
      getStateKey() {
        return this.userLogin && this.userLogin.id ? `_test_state_${this.userLogin.id}` : '_test_state';
      },
      pad(d) { return d < 10 ? '0' + Math.floor(d) : '' + Math.floor(d); },
      markActivity() {
        this.lastActivityTs = Date.now();
      },
      ensureCurrentWordVisible() {
        const el = document.getElementById('currentWord');
        const para = document.querySelector('.typing-paragraph');
        if (!el || !para) return;

        // Wait for DOM to fully reflow before calculating positions
        requestAnimationFrame(() => {
          const elementTop = el.offsetTop;
          const elementHeight = el.offsetHeight;
          const containerTop = para.scrollTop;
          const containerHeight = para.clientHeight;
          const containerBottom = containerTop + containerHeight;
          
          // Calculate ideal scroll position to center the word with 30% margin from top
          const desiredTop = Math.max(0, elementTop - Math.floor(containerHeight * 0.3));
          
          // Check if element is outside visible area (with small buffer zones)
          const topBuffer = 20;
          const bottomBuffer = 40;
          
          // If word is above visible area, scroll it to 30% position
          if (elementTop < containerTop + topBuffer) {
            para.scrollTop = desiredTop;
          }
          // If word is below visible area (with buffer), scroll it up to stay visible
          else if (elementTop + elementHeight > containerBottom - bottomBuffer) {
            para.scrollTop = Math.max(0, elementTop + elementHeight - containerHeight + bottomBuffer);
          }
        });
      },
      resetParagraphViewport() {
        const para = document.querySelector('.typing-paragraph');
        if (!para) return;
        para.scrollTop = 0;
        requestAnimationFrame(() => {
          para.scrollTop = 0;
          setTimeout(() => {
            para.scrollTop = 0;
            this.ensureCurrentWordVisible();
          }, 0);
        });
      },
      buildResultPayload(reason) {
        const u = this.getLogin();
        if (!u) return null;
        this.result.total_words_typed = [...this.result.correct_words, ...this.result.incorrect_words].join(' ');
        this.result.time = this.time;
        this.result.uid = u.id;
        this.result.roll_no = u.roll_no;
        this.result.center_id = u.center_id;
        this.result.finish_reason = reason || this.result.finish_reason || 'completed';
        return { result: this.result };
      },
      getPendingResultQueue() {
        try {
          const raw = localStorage.getItem('_pending_result_queue');
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      },
      setPendingResultQueue(queue) {
        localStorage.setItem('_pending_result_queue', JSON.stringify(queue || []));
      },
      queuePendingResult(payload) {
        const queue = this.getPendingResultQueue();
        const uid = String(payload?.result?.uid || '');
        const kept = queue.filter(item => String(item?.result?.uid || '') !== uid);
        const previous = queue.find(item => String(item?.result?.uid || '') === uid);
        kept.push({ ...payload, queued_at: Date.now(), attempts: (previous?.attempts || 0) + 1 });
        this.setPendingResultQueue(kept);
        this.resultSubmitState = 'pending';
        this.resultSubmitMessage = 'Result not submitted. Connect internet and it will retry automatically.';
      },
      removePendingResult(uid) {
        const next = this.getPendingResultQueue().filter(item => String(item?.result?.uid || '') !== String(uid));
        this.setPendingResultQueue(next);
      },
      submitResultPayload(payload) {
        return this.$http.post(apiUrl('save_result.php'), JSON.stringify(payload)).then(r => {
          const body = r.body || {};
          if (body.status !== 'done') throw new Error(body.message || 'Submission failed');
          return body;
        });
      },
      syncPendingResults() {
        const queue = this.getPendingResultQueue();
        if (!queue.length || !navigator.onLine) return;
        this.resultSubmitState = 'retrying';
        this.resultSubmitMessage = 'Retrying result submission...';
        const pending = queue.slice();
        const run = (index) => {
          if (index >= pending.length) {
            this.resultSubmitState = 'saved';
            this.resultSubmitMessage = 'Result submitted successfully.';
            return;
          }
          const payload = pending[index];
          this.submitResultPayload(payload).then(() => {
            this.removePendingResult(payload?.result?.uid);
            run(index + 1);
          }).catch(() => {
            this.resultSubmitState = 'pending';
            this.resultSubmitMessage = 'Result not submitted. Connect internet and it will retry automatically.';
          });
        };
        run(0);
      },
      sendAbandonBeacon() {
        if (this.result.announced) return;
        this.updateRealtimeMetrics();
        const payload = this.buildResultPayload('abandoned');
        if (!payload) return;
        if (navigator.sendBeacon) {
          const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
          navigator.sendBeacon(apiUrl('save_result.php'), blob);
        }
      },
      saveProgressState() {
        if (!this.stateKey || this.result.announced) return;
        const state = {
          uid: this.userLogin ? this.userLogin.id : null,
          time: this.time,
          remaining_time: this.remaining_time,
          passed_time: this.passed_time,
          typedWords: this.typedWords,
          typedWord: this.typedWord,
          character_pressed: this.character_pressed,
          first: this.first,
          saved_at: Date.now()
        };
        localStorage.setItem(this.stateKey, JSON.stringify(state));
      },
      clearProgressState() {
        if (this.stateKey) localStorage.removeItem(this.stateKey);
      },
      rebuildFromTypedWords() {
        this.correct = 0;
        this.incorrect = 0;
        this.result.correct_words = [];
        this.result.incorrect_words = [];
        this.processed_words = this.unprocessed_words.slice();
        this.character_pressed = 0;

        for (let i = 0; i < this.typedWords.length && i < this.unprocessed_words.length; i++) {
          const tw = (this.typedWords[i] || '').trim();
          const ow = this.unprocessed_words[i];
          this.character_pressed += tw.length + 1;
          const isCorrect = tw === ow;
          if (isCorrect) {
            this.correct++;
            this.result.correct_words.push(tw);
            this.processed_words[i] = `<span style="color:#2e7d32;background:#e8f5e9">${ow}</span>`;
          } else {
            this.incorrect++;
            this.result.incorrect_words.push(tw);
            this.processed_words[i] = `<span style="color:#c62828;background:#fce4ec;text-decoration:line-through">${ow}</span>`;
          }
        }

        const nextIndex = this.typedWords.length;
        if (nextIndex < this.unprocessed_words.length) {
          this.processed_words[nextIndex] = `<span id="currentWord" style="background:#fff9c4;border-bottom:2px solid #f9a825">${this.unprocessed_words[nextIndex]}</span>`;
        }
        this.paragraphHTML = this.processed_words.join(' ');
        this.updateRealtimeMetrics();
      },
      restoreProgressState() {
        if (!this.stateKey) return;
        const raw = localStorage.getItem(this.stateKey);
        if (!raw) return;

        try {
          const st = JSON.parse(raw);
          if (!st || !Array.isArray(st.typedWords)) return;
          this.typedWords = st.typedWords;
          this.typedWord = st.typedWord || '';
          this.passed_time = Number.isFinite(st.passed_time) ? st.passed_time : 0;
          this.remaining_time = Number.isFinite(st.remaining_time) ? st.remaining_time : (this.time * 60);
          this.first = !!st.first;
          this.rebuildFromTypedWords();
          // Do not auto-resume a closed attempt. Candidate must be reset by admin/incharge.
          this.typedWords = [];
          this.typedWord = '';
          this.clearProgressState();
          this.rebuildFromTypedWords();
        } catch (e) {
          localStorage.removeItem(this.stateKey);
        }
      },
      startTimer() {
        if (this.timerHandle || this.testFinished || this.result.announced) return;
        this.timerHandle = setInterval(() => {
          this.remaining_time--;
          this.passed_time = (this.time * 60) - this.remaining_time;
          this.updateRealtimeMetrics();

          if ((Date.now() - this.lastActivityTs) > (this.inactivityLimitSec * 1000)) {
            this.finalizeTest('inactivity');
            return;
          }

          if (this.remaining_time <= 0) {
            this.finalizeTest('timeout');
          }
        }, 1000);
      },
      updateRealtimeMetrics() {
        const elapsedMinutes = Math.max(this.passed_time / 60, 1 / 60);
        this.result.total_characters = this.character_pressed;
        this.result.correct_characters = this.result.correct_words.join(' ').length;
        this.result.incorrect_characters = this.result.incorrect_words.join(' ').length;
        this.result.accuracy = this.result.total_characters > 0
          ? Math.floor((this.result.correct_characters / this.result.total_characters) * 100)
          : 0;

        // Standard typing formula style:
        // Gross WPM = total typed chars / 5 / elapsed minutes
        // Net WPM = correct chars / 5 / elapsed minutes
        this.grossWpm = Math.max(0, Math.floor((this.result.total_characters / 5) / elapsedMinutes));
        this.wpm = Math.max(0, Math.floor((this.result.correct_characters / 5) / elapsedMinutes));
        this.result.gross_wpm = this.grossWpm;
        this.result.wpm = this.wpm;
        this.saveProgressState();
      },
      highlightFirst() {
        this.processed_words[0] = `<span id="currentWord" style="background:#fff9c4;border-bottom:2px solid #f9a825">${this.unprocessed_words[0]}</span>`;
      },
      loadConfig() {
        return this.$http.get(apiUrl('config.php')).then(r => {
          const mins = parseInt(r.body.default_test_minutes, 10);
          this.time = Number.isFinite(mins) && mins > 0 ? mins : 1;
        }).catch(() => {
          this.time = 1;
        });
      },
      saveResult() {
        const payload = this.buildResultPayload(this.result.finish_reason || 'completed');
        if (!payload) return;
        if (!navigator.onLine) {
          this.queuePendingResult(payload);
          this.startResultRetryLoop();
          return;
        }
        this.submitResultPayload(payload)
          .then(() => {
            this.removePendingResult(payload.result.uid);
            this.resultSubmitState = 'saved';
            this.resultSubmitMessage = 'Result submitted successfully.';
            localStorage.removeItem('_td');
            localStorage.removeItem('_test_active');
          }).catch(() => {
            this.queuePendingResult(payload);
            this.startResultRetryLoop();
          });
      },
      startResultRetryLoop() {
        if (this.resultRetryTimer) return;
        const retry = () => {
          if (this.result.announced && this.getPendingResultQueue().length > 0 && navigator.onLine) {
            this.syncPendingResults();
          }
        };
        this.resultRetryTimer = setInterval(retry, 5000);
        window.addEventListener('online', retry);
      },
      finalizeTest(reason) {
        if (this.testFinished) return;
        this.testFinished = true;
        if (this.timerHandle) {
          clearInterval(this.timerHandle);
          this.timerHandle = null;
        }
        this.updateRealtimeMetrics();
        this.result.finish_reason = reason;
        this.result.announced = true;
        this.clearProgressState();
        this.resultSubmitState = 'pending';
        this.resultSubmitMessage = 'Submitting result...';

        // Keep browser URL on login route after completion so F5 never lands on typing-test path.
        window.history.replaceState({}, '', APP_BASE);

        this.saveResult();
      },
      init() {
        this.markActivity();
        if (this.first && this.typedWord.length > 0) {
          this.first = false;
          this.startTimer();
        }
      },
      loadParagraph() {
        const candidateType = this.userLogin && this.userLogin.type ? this.userLogin.type : 1;
        const candidateUid = this.userLogin && this.userLogin.id ? this.userLogin.id : '';
        return this.$http.get(apiUrl('get_paragraph.php') + '?type=' + encodeURIComponent(candidateType) + '&uid=' + encodeURIComponent(candidateUid)).then(r => {
          this.paragraph = r.body.content.replace(/\n|\r/g, ' ').replace(/ +/g, ' ').trim();
          this.processed_words = this.paragraph.split(' ');
          this.unprocessed_words = this.paragraph.split(' ');
          this.highlightFirst();
          this.paragraphHTML = this.processed_words.join(' ');
          this.$nextTick(() => this.resetParagraphViewport());
        });
      }
    },
    mounted() {
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      this.userLogin = this.getLogin();
      if (!this.userLogin) { this.$router.push('/login'); return; }
      this.stateKey = this.getStateKey();
      this.markActivity();
      this.loadConfig().then(() => {
        this.remaining_time = this.time * 60;
        this.loadParagraph().then(() => {
          this.restoreProgressState();
          this.$nextTick(() => {
            this.resetParagraphViewport();
            const input = document.querySelector('.typed-words');
            if (input && input.focus) input.focus({ preventScroll: true });
          });
        });
      });
      this.syncPendingResults();
      this.startResultRetryLoop();
      document.querySelectorAll("input[type='text']").forEach(el => {
        el.addEventListener('cut',  e => e.preventDefault());
        el.addEventListener('copy', e => e.preventDefault());
        el.addEventListener('paste',e => e.preventDefault());
        el.addEventListener('drop', e => e.preventDefault());
      });

      this.unloadHandler = e => {
        if (!this.result.announced) {
          e.preventDefault();
          e.returnValue = 'Your test is in progress. Leaving now will disqualify this attempt.';
          return e.returnValue;
        }
      };
      window.addEventListener('beforeunload', this.unloadHandler);

      this.pageHideHandler = () => {
        if (!this.result.announced) {
          localStorage.removeItem('_td');
          localStorage.removeItem('_test_active');
          this.clearProgressState();
        }
      };
      window.addEventListener('pagehide', this.pageHideHandler);

      this.focusWarningHandler = () => {
        if (this.result.announced) return;
        if (document.hidden) {
          if (!this.focusWarningShown) {
            this.focusWarningShown = true;
            this.$root.showModal('Warning', 'Do not switch tabs or windows during the test. Your attempt will continue, but the activity is being monitored.');
          }
        } else {
          this.focusWarningShown = false;
        }
      };
      document.addEventListener('visibilitychange', this.focusWarningHandler);
      window.addEventListener('blur', this.focusWarningHandler);

      this.refreshKeyHandler = e => {
        const key = (e.key || '').toLowerCase();
        const code = e.keyCode || e.which;
        const blocked = key === 'f5' || key === 'f12' || code === 116 || code === 123 || (e.ctrlKey && key === 'r') || (e.metaKey && key === 'r');
        if (!this.result.announced && blocked) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return false;
        }
      };
      window.addEventListener('keydown', this.refreshKeyHandler, true);
      document.addEventListener('keydown', this.refreshKeyHandler, true);

      this.activityHandler = () => this.markActivity();
      window.addEventListener('keydown', this.activityHandler);
      window.addEventListener('mousedown', this.activityHandler);
      window.addEventListener('touchstart', this.activityHandler);
    },
    beforeDestroy() {
      if (this.unloadHandler) window.removeEventListener('beforeunload', this.unloadHandler);
      if (this.pageHideHandler) window.removeEventListener('pagehide', this.pageHideHandler);
      if (this.focusWarningHandler) {
        document.removeEventListener('visibilitychange', this.focusWarningHandler);
        window.removeEventListener('blur', this.focusWarningHandler);
      }
      if (this.refreshKeyHandler) {
        window.removeEventListener('keydown', this.refreshKeyHandler, true);
        document.removeEventListener('keydown', this.refreshKeyHandler, true);
      }
      if (this.activityHandler) {
        window.removeEventListener('keydown', this.activityHandler);
        window.removeEventListener('mousedown', this.activityHandler);
        window.removeEventListener('touchstart', this.activityHandler);
      }
      if (this.timerHandle) clearInterval(this.timerHandle);
    }
  });

  // ════════════════════════════════════════
  // ROUTER + APP
  // ════════════════════════════════════════
  const router = new VueRouter({
    mode: 'history',
    routes: [
      { path: '/', component: LoginComponent, name: 'home' },
      { path: '/login', component: LoginComponent, name: 'login' },
      {
        path: '/typing-test', component: TypingTestComponent, name: 'typing',
        beforeEnter(to, from, next) {
          const hasLogin = !!localStorage.getItem('_td');
          const activeTest = localStorage.getItem('_test_active') === '1';
          if (!from.name && !(hasLogin && activeTest)) {
            localStorage.removeItem('_td');
            next('/');
          } else {
            next();
          }
        }
      }
    ]
  });

  const app = new Vue({
    el: '#typing-application',
    router,
    data: {
      globalLoading: false,
      modal: { show: false, title: '', body: '', icon: '⚠️' }
    },
    methods: {
      showModal(title, body, icon = '⚠️') {
        this.modal = { show: true, title, body, icon };
      }
    }
  });
</script>
</body>
</html>
